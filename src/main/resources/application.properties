app.upload.dir=src/main/resources/static/datastore

spring.servlet.multipart.max-file-size=50MB
# groq is the default open-model provider; set CHAT_PROVIDER=anthropic to use the fallback.
chat.provider=${CHAT_PROVIDER:groq}
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.url=https://api.anthropic.com/v1/messages
anthropic.model=claude-sonnet-4-20250514

# Replicate API – get your token at https://replicate.com/account/api-tokens
replicate.api.token=${REPLICATE_API_TOKEN:}

app.base-url=http://localhost:8080
app.cors.origin=${CORS_ORIGIN:http://localhost:*}
server.port=${PORT:8080}
