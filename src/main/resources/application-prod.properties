# Google OAuth2 values are required in the production environment.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://retail-discovery.onrender.com/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
server.error.include-message=never
